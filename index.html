<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KeuanganKu</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #f5f6fa;
}

.header {
  background: linear-gradient(135deg,#4CAF50,#2ecc71);
  color: white;
  padding: 20px;
  border-bottom-left-radius: 20px;
  border-bottom-right-radius: 20px;
}

.balance {
  background: white;
  margin: -30px 15px 15px 15px;
  padding: 15px;
  border-radius: 15px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.card {
  background: white;
  margin: 15px;
  padding: 15px;
  border-radius: 15px;
}

input, select {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 8px;
  border: 1px solid #ddd;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  background: #4CAF50;
  color: white;
  border: none;
  border-radius: 10px;
}

.item {
  display: flex;
  justify-content: space-between;
  margin: 10px 0;
}

.income { color: green; }
.expense { color: red; }

.small {
  font-size: 12px;
  color: gray;
}

.summary-item {
  margin: 8px 0;
  padding: 10px;
  background: #f9f9f9;
  border-radius: 8px;
}
</style>
</head>

<body>

<div class="header">
  <h2>KeuanganKu</h2>
</div>

<div class="balance">
  <p>Saldo</p>
  <h1 id="saldo">Rp 0</h1>
  <small>Pemasukan: Rp <span id="income">0</span> | Pengeluaran: Rp <span id="expense">0</span></small>
</div>

<div class="card">
  <canvas id="chart"></canvas>
</div>

<div class="card">
  <h3>Tambah Transaksi</h3>
  <input type="date" id="tanggal">
  <select id="jenis">
    <option value="income">Pemasukan</option>
    <option value="expense">Pengeluaran</option>
  </select>
  <input type="text" id="kategori" placeholder="Kategori">
  <input type="number" id="jumlah" placeholder="Jumlah">
  <button onclick="tambah()">Simpan</button>
</div>

<div class="card">
  <h3>Ringkasan Bulanan</h3>
  <div id="monthly"></div>
</div>

<div class="card">
  <h3>Riwayat</h3>
  <div id="list"></div>
</div>

<script>
let data = JSON.parse(localStorage.getItem("keuangan")) || [];

function rupiah(n){
  return n.toLocaleString("id-ID");
}

function save(){
  localStorage.setItem("keuangan", JSON.stringify(data));
}

function render(){
  let income = 0;
  let expense = 0;
  let list = document.getElementById("list");
  list.innerHTML = "";

  let monthly = {};

  data.forEach((d,i)=>{
    let bulan = d.tanggal.slice(0,7); // YYYY-MM

    if(!monthly[bulan]){
      monthly[bulan] = {income:0, expense:0};
    }

    if(d.jenis==="income"){
      income += d.jumlah;
      monthly[bulan].income += d.jumlah;
    } else {
      expense += d.jumlah;
      monthly[bulan].expense += d.jumlah;
    }

    list.innerHTML += `
      <div class="item">
        <div>
          <b>${d.kategori}</b><br>
          <span class="small">${d.tanggal}</span>
        </div>
        <div class="${d.jenis}">
          Rp ${rupiah(d.jumlah)}
          <br><button onclick="hapus(${i})">❌</button>
        </div>
      </div>
    `;
  });

  // tampil ringkasan bulanan
  let monthlyDiv = document.getElementById("monthly");
  monthlyDiv.innerHTML = "";

  Object.keys(monthly).sort().reverse().forEach(bulan=>{
    monthlyDiv.innerHTML += `
      <div class="summary-item">
        <b>${bulan}</b><br>
        <span class="income">Pemasukan: Rp ${rupiah(monthly[bulan].income)}</span><br>
        <span class="expense">Pengeluaran: Rp ${rupiah(monthly[bulan].expense)}</span>
      </div>
    `;
  });

  document.getElementById("income").innerText = rupiah(income);
  document.getElementById("expense").innerText = rupiah(expense);
  document.getElementById("saldo").innerText = "Rp " + rupiah(income-expense);

  chartUpdate(income, expense);
}

function tambah(){
  let t=document.getElementById("tanggal").value;
  let j=document.getElementById("jenis").value;
  let k=document.getElementById("kategori").value;
  let u=parseInt(document.getElementById("jumlah").value);

  if(!t||!k||!u) return alert("Isi lengkap");

  data.push({tanggal:t,jenis:j,kategori:k,jumlah:u});
  save();
  render();
}

function hapus(i){
  data.splice(i,1);
  save();
  render();
}

let chart;

function chartUpdate(income, expense){
  let ctx=document.getElementById("chart");
  if(chart) chart.destroy();

  chart=new Chart(ctx,{
    type:'doughnut',
    data:{
      labels:['Pemasukan','Pengeluaran'],
      datasets:[{
        data:[income,expense],
        backgroundColor:['#2ecc71','#e74c3c']
      }]
    }
  });
}

render();
</script>

</body>
</html>
