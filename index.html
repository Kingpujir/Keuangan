<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KeuanganKu</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #f5f6fa;
}

.header {
  background: linear-gradient(135deg,#4CAF50,#2ecc71);
  color: white;
  padding: 20px;
  border-radius: 0 0 20px 20px;
}

.balance, .card {
  background: white;
  margin: 15px;
  padding: 15px;
  border-radius: 15px;
}

.balance {
  margin-top: -30px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

input, select {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 8px;
  border: 1px solid #ddd;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  background: #4CAF50;
  color: white;
  border: none;
  border-radius: 10px;
}

.item {
  display: flex;
  justify-content: space-between;
  margin: 10px 0;
}

.income { color: green; }
.expense { color: red; }

.small {
  font-size: 12px;
  color: gray;
}
</style>
</head>

<body>

<div class="header">
  <h2>KeuanganKu</h2>
</div>

<div class="balance">
  <h3>Saldo</h3>
  <h1 id="saldo">Rp 0</h1>
  <small>Pemasukan: Rp <span id="income">0</span> | Pengeluaran: Rp <span id="expense">0</span></small>
</div>

<div class="card">
  <canvas id="mainChart"></canvas>
</div>

<div class="card">
  <h3>Tambah Transaksi</h3>
  <input type="date" id="tanggal">
  <select id="jenis">
    <option value="income">Pemasukan</option>
    <option value="expense">Pengeluaran</option>
  </select>
  <input type="text" id="kategori" placeholder="Kategori">
  <input type="number" id="jumlah" placeholder="Jumlah">
  <button onclick="tambah()">Simpan</button>
</div>

<!-- 🔥 MENU BULANAN -->
<div class="card">
  <h3>Detail Bulanan</h3>
  <select id="bulanSelect" onchange="renderBulanan()"></select>

  <p class="income">Pemasukan: Rp <span id="mIncome">0</span></p>
  <p class="expense">Pengeluaran: Rp <span id="mExpense">0</span></p>

  <canvas id="bulanChart"></canvas>

  <div id="bulanList"></div>
</div>

<script>
let data = JSON.parse(localStorage.getItem("keuangan")) || [];

function rupiah(n){ return n.toLocaleString("id-ID"); }
function save(){ localStorage.setItem("keuangan", JSON.stringify(data)); }

function tambah(){
  let t=document.getElementById("tanggal").value;
  let j=document.getElementById("jenis").value;
  let k=document.getElementById("kategori").value;
  let u=parseInt(document.getElementById("jumlah").value);

  if(!t||!k||!u) return alert("Isi lengkap");

  data.push({tanggal:t,jenis:j,kategori:k,jumlah:u});
  save();
  render();
}

function render(){
  let income=0, expense=0;
  let bulanSet=new Set();

  data.forEach(d=>{
    let bulan=d.tanggal.slice(0,7);
    bulanSet.add(bulan);

    if(d.jenis==="income") income+=d.jumlah;
    else expense+=d.jumlah;
  });

  document.getElementById("income").innerText=rupiah(income);
  document.getElementById("expense").innerText=rupiah(expense);
  document.getElementById("saldo").innerText="Rp "+rupiah(income-expense);

  // isi dropdown bulan
  let select=document.getElementById("bulanSelect");
  select.innerHTML="";
  [...bulanSet].sort().reverse().forEach(b=>{
    select.innerHTML+=`<option value="${b}">${b}</option>`;
  });

  chartMain(income, expense);
  renderBulanan();
}

function renderBulanan(){
  let bulan=document.getElementById("bulanSelect").value;
  let list=document.getElementById("bulanList");
  list.innerHTML="";

  let income=0, expense=0;

  data.filter(d=>d.tanggal.startsWith(bulan)).forEach((d,i)=>{
    if(d.jenis==="income") income+=d.jumlah;
    else expense+=d.jumlah;

    list.innerHTML+=`
      <div class="item">
        <div>
          <b>${d.kategori}</b><br>
          <span class="small">${d.tanggal}</span>
        </div>
        <div class="${d.jenis}">
          Rp ${rupiah(d.jumlah)}
        </div>
      </div>
    `;
  });

  document.getElementById("mIncome").innerText=rupiah(income);
  document.getElementById("mExpense").innerText=rupiah(expense);

  chartBulan(income, expense);
}

let mainChart, bulanChart;

function chartMain(income, expense){
  let ctx=document.getElementById("mainChart");
  if(mainChart) mainChart.destroy();

  mainChart=new Chart(ctx,{
    type:'doughnut',
    data:{
      labels:['Pemasukan','Pengeluaran'],
      datasets:[{
        data:[income,expense],
        backgroundColor:['#2ecc71','#e74c3c']
      }]
    }
  });
}

function chartBulan(income, expense){
  let ctx=document.getElementById("bulanChart");
  if(bulanChart) bulanChart.destroy();

  bulanChart=new Chart(ctx,{
    type:'bar',
    data:{
      labels:['Pemasukan','Pengeluaran'],
      datasets:[{
        data:[income,expense],
        backgroundColor:['#2ecc71','#e74c3c']
      }]
    }
  });
}

render();
</script>

</body>
</html>
